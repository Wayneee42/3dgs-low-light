DATASET:
  NAME: 'GearWorks'
  DATA_PATH: 'dataset/Development/lowlight_development/development/GearWorks'
  BACKGROUND_COLOR: 255.0
  AUXILIARY_DIR: 'auxiliaries'

SEED: 3407Cupcake

MODEL:
  NAME: 'Simple3DGS'
  NUM_INIT_POINTS: 100000
  INIT_MODE: 'hybrid_anchor'
  INIT_ANCHOR_RATIO: 0.10
  INIT_ANCHOR_MAX_DEPTH_GRAD: 0.08
  INIT_ANCHOR_BRIGHTNESS_QUANTILE: 0.0
  INIT_DEPTH_DIR: 'auxiliaries/depth'
  INIT_DEPTH_NORMALIZATION: 'per_frame_robust'
  INIT_DEPTH_NORM_LOW_Q: 1.0
  INIT_DEPTH_NORM_HIGH_Q: 99.0
  INIT_VOXEL_DOWNSAMPLE: true
  INIT_VOXEL_SIZE: 0.03
  INIT_BACKPROJECT_NEAR: 0.2
  INIT_BACKPROJECT_FAR: 6.0
  INIT_BACKPROJECT_SAMPLE_STRIDE: 4
  INIT_BACKPROJECT_MIN_VALID_POINTS: 100000
  INIT_BACKPROJECT_DEPTH_EPS: 1.0e-3
  INIT_BACKPROJECT_DEPTH_INVERT: false
  SH_DEGREE: 3
  SCENE_SCALE: 2.0
  TRAIN_TOTAL_STEP: 30000
  VAL_INTERVAL_STEP: 5000
  LOG_INTERVAL_STEP: 100
  SH_UPGRADE_INTERVAL: 1000
  CHECKPOINT_STEPS: [15000, 20000, 25000, 30000]
  LR_MEANS: 1.6e-4
  LR_MEANS_FINAL: 1.6e-6
  LR_QUATS: 1.0e-3
  LR_SCALES: 5.0e-3
  LR_OPACITIES: 5.0e-2
  LR_SH0: 2.5e-3
  LR_SHN: 1.25e-4
  DENSIFY_START_STEP: 500
  DENSIFY_STOP_STEP: 15000
  DENSIFY_INTERVAL: 100
  DENSIFY_GRAD_THRESH: 0.0002
  OPACITY_RESET_INTERVAL: 3000
  LAMBDA_SSIM: 0.2

AUGMENTATION:
  ENABLED: true
  MODE: 'hybrid'
  GAMMA_RANGE: [0.45, 0.65]
  EVAL_GAMMA: 0.55
  TARGET_MEAN: 0.38
  TARGET_MEAN_JITTER: 0.10
  MIN_SCALE: 1.0
  MAX_SCALE: 3.0

LOSS:
  LAMBDA_SSIM: 0.2
  LAMBDA_LOW_LIGHT: 0.10
  LAMBDA_EXPOSURE: 0.05

PRIORS:
  DEPTH:
    ENABLED: true
    WEIGHT: 0.02
    GLOBAL_WEIGHT: 1.0
    LOCAL_WEIGHT: 1.0
    BOX_SIZE: 128
    SAMPLE_RATIO: 0.5
    START_STEP: 5000
  STRUCTURE:
    ENABLED: true
    WEIGHT: 0.01
    START_STEP: 10000
    INVARIANT: 'W'
    KERNEL_SIZE: 3
    SCALE: 0.8

EXPERIMENT:
  STAGE: 'stage5b'


